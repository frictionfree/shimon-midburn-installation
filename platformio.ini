; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = hardware

; ---- Real hardware env ESP32-DevKitC V4 (with DFPlayer Mini) ----
[env:hardware]
platform = espressif32
board = esp32dev  ; esp32dev works for DevKitC V4
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_deps =
  dfrobot/DFRobotDFPlayerMini@^1.0.6

; ---- Hardware env for COM6 ----
[env:hardware-com6]
platform = espressif32
board = esp32dev  ; esp32dev works for DevKitC V4
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
lib_deps =
  dfrobot/DFRobotDFPlayerMini@^1.0.6
